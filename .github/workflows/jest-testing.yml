name: Run Jest testing suite

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager to use ('bun' or 'yarn')"
        required: false
        default: "bun"
        type: string
      bun-version:
        description: "Bun version (when using bun)"
        required: false
        default: "latest"
        type: string
      node-version:
        description: "Node.js version (when using yarn)"
        required: false
        default: "20"
        type: string
      yarn-version:
        description: "Optional Yarn version activated via Corepack (when using yarn)"
        required: false
        default: ""
        type: string
      install-command:
        description: "Optional custom dependency installation command"
        required: false
        default: ""
        type: string
      test-command:
        description: "Optional custom test execution command"
        required: false
        default: ""
        type: string
  workflow_dispatch:
  pull_request:

env:
  NODE_ENV: "test"

jobs:
  testing:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: ${{ inputs.package-manager == 'bun' || inputs.package-manager == '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version || 'latest' }}

      - name: Setup Node
        if: ${{ inputs.package-manager == 'yarn' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '20' }}
          cache: "yarn"

      - name: Setup Yarn
        if: ${{ inputs.package-manager == 'yarn' && inputs.yarn-version != '' }}
        run: corepack enable && corepack prepare "yarn@${{ inputs.yarn-version }}" --activate

      - name: Run Tests (Bun)
        if: ${{ inputs.package-manager == 'bun' || inputs.package-manager == '' }}
        run: |
          ${{ inputs.install-command || 'bun install --frozen-lockfile' }}
          ${{ inputs.test-command || 'bun run test' }}

      - name: Run Tests (Yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: |
          ${{ inputs.install-command || 'yarn install --immutable' }}
          ${{ inputs.test-command || 'yarn test' }}

      - name: Add Jest Report to Summary
        if: always()
        run: |
          if [ -f test-dashboard.md ]; then
            cat test-dashboard.md >> $GITHUB_STEP_SUMMARY
          fi
